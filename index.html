<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>오목 게임</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  background:linear-gradient(135deg,#f5e6c8,#d8b47a); color:#33261b;
  display:flex; justify-content:center; align-items:center; padding:18px;
}
.app{width:min(96vw,720px); text-align:center}
h1{margin:0 0 8px;font-size:clamp(28px,6vw,46px)}
.subtitle{margin:0 0 16px;color:#634d39}
.panel{
  background:rgba(255,255,255,.88); border-radius:18px; padding:14px;
  box-shadow:0 12px 35px rgba(70,40,10,.2)
}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
button,select{
  border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;
  background:#5b3924;color:#fff;font-weight:700
}
button:hover{filter:brightness(1.1)}
select{background:#eee0cd;color:#33261b}
.status{font-weight:800;margin:8px 0 12px;font-size:18px}
.board-wrap{display:flex;justify-content:center;overflow:auto;padding:4px}
canvas{
  width:min(92vw,600px);height:min(92vw,600px);max-width:600px;max-height:600px;
  background:#d9a85b;border-radius:8px;box-shadow:inset 0 0 0 3px #8b5a2b;
  touch-action:manipulation; cursor:pointer;
}
.note{font-size:12px;color:#725b47;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <h1>⚫ 오목 게임 ⚪</h1>
  <p class="subtitle">15×15 · 5개의 돌을 먼저 연결하면 승리!</p>
  <div class="panel">
    <div class="controls">
      <select id="mode">
        <option value="ai">컴퓨터와 대전</option>
        <option value="pvp">2인 대전</option>
      </select>
      <button id="restart">🔄 새 게임</button>
    </div>
    <div id="status" class="status">흑돌 차례입니다.</div>
    <div class="board-wrap"><canvas id="board" width="600" height="600"></canvas></div>
    <div class="note">컴퓨터 대전에서는 당신이 흑돌입니다.</div>
  </div>
</div>

<script>
const SIZE=15, canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'), modeEl=document.getElementById('mode');
let board, turn, gameOver, winningCells=[];

function init(){
  board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  turn=1; gameOver=false; winningCells=[];
  statusEl.textContent='흑돌 차례입니다.';
  draw();
}
function draw(){
  const W=canvas.width, pad=25, gap=(W-pad*2)/(SIZE-1);
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle='#d9a85b'; ctx.fillRect(0,0,W,W);
  ctx.strokeStyle='#6b4728'; ctx.lineWidth=1;
  for(let i=0;i<SIZE;i++){
    const p=pad+i*gap;
    ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,W-pad);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(W-pad,p);ctx.stroke();
  }
  ctx.fillStyle='#5a351e';
  [3,7,11].forEach(r=>[3,7,11].forEach(c=>{
    ctx.beginPath();ctx.arc(pad+c*gap,pad+r*gap,4,0,Math.PI*2);ctx.fill();
  }));
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(!board[r][c])continue;
    const x=pad+c*gap,y=pad+r*gap;
    ctx.beginPath();ctx.arc(x,y,gap*.40,0,Math.PI*2);
    const g=ctx.createRadialGradient(x-gap*.12,y-gap*.12,2,x,y,gap*.4);
    if(board[r][c]===1){g.addColorStop(0,'#555');g.addColorStop(1,'#050505')}
    else{g.addColorStop(0,'#fff');g.addColorStop(1,'#c8c8c8')}
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=board[r][c]===1?'#000':'#888';ctx.lineWidth=1;ctx.stroke();
  }
  winningCells.forEach(([r,c])=>{
    const x=pad+c*gap,y=pad+r*gap;
    ctx.strokeStyle='#e33';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(x,y,gap*.45,0,Math.PI*2);ctx.stroke();
  });
}
function posFromEvent(e){
  const rect=canvas.getBoundingClientRect(), pad=25, gap=(600-pad*2)/(SIZE-1);
  const x=(e.clientX-rect.left)*(600/rect.width), y=(e.clientY-rect.top)*(600/rect.height);
  const c=Math.round((x-pad)/gap), r=Math.round((y-pad)/gap);
  if(r<0||r>=SIZE||c<0||c>=SIZE)return null;
  return [r,c];
}
function checkWin(r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let cells=[[r,c]];
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr][cc]===p){
        cells.push([rr,cc]);rr+=dr*s;cc+=dc*s;
      }
    }
    if(cells.length>=5){winningCells=cells;return true}
  }
  return false;
}
function place(r,c,p){
  if(gameOver||board[r][c])return false;
  board[r][c]=p; draw();
  if(checkWin(r,c,p)){
    gameOver=true; draw();
    statusEl.textContent=(p===1?'⚫ 흑돌':'⚪ 백돌')+' 승리! 🎉';
    return true;
  }
  if(board.flat().every(Boolean)){
    gameOver=true;statusEl.textContent='무승부입니다!';return true;
  }
  turn=3-p;
  statusEl.textContent=(turn===1?'흑돌':'백돌')+' 차례입니다.';
  return true;
}
canvas.addEventListener('click',e=>{
  if(gameOver)return;
  const pos=posFromEvent(e); if(!pos)return;
  const [r,c]=pos;
  if(board[r][c])return;
  if(modeEl.value==='pvp'){place(r,c,turn);return}
  if(turn!==1)return;
  place(r,c,1);
  if(!gameOver) setTimeout(aiMove,180);
});
function aiMove(){
  if(gameOver||turn!==2)return;
  const move=findBestMove();
  place(move[0],move[1],2);
}
function scoreLine(r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let total=0;
  for(const [dr,dc] of dirs){
    let n=1, open=0;
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}
      if(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&!board[rr][cc])open++;
    }
    if(n>=5)total+=1000000;
    else if(n===4&&open===2)total+=100000;
    else if(n===4&&open===1)total+=10000;
    else if(n===3&&open===2)total+=5000;
    else if(n===3&&open===1)total+=500;
    else if(n===2&&open===2)total+=200;
  }
  return total;
}
function findBestMove(){
  let best=null,bestScore=-Infinity;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(board[r][c])continue;
    const center=7-Math.max(Math.abs(7-r),Math.abs(7-c));
    board[r][c]=2;
    const attack=scoreLine(r,c,2);
    board[r][c]=1;
    const defense=scoreLine(r,c,1);
    board[r][c]=0;
    const score=attack*1.15+defense+center*8+Math.random()*3;
    if(score>bestScore){bestScore=score;best=[r,c]}
  }
  return best||[7,7];
}
document.getElementById('restart').onclick=init;
modeEl.onchange=init;
init();
</script>
</body>
</html>
